[tool.ruff]
# Deliberately one version below the runtime floor. hacs.json declares a
# minimum of Home Assistant 2026.8.0, which requires Python 3.14.2, so py314
# would be accurate -- but it lets the formatter rewrite code into 3.14-only
# syntax (unparenthesized `except A, B:`) for no benefit, and tooling that
# parses the source with an older interpreter would then choke on it.
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=custom_components.librenms --cov-report=term-missing"

[tool.coverage.run]
source = ["custom_components/librenms"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
