name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # pytest-homeassistant-custom-component requires Python 3.14 from 0.13.317
  # onwards, which covers every Home Assistant release in the matrix below.
  DEFAULT_PYTHON: "3.14"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .
      - run: ruff format --check .

  pytest:
    name: pytest (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each pytest-homeassistant-custom-component release pins exactly one
        # Home Assistant release, so the HA version is selected by pinning the
        # plugin. Check its release notes when bumping these.
        include:
          - homeassistant: "2026.8.0"
            phcc: "0.13.354"
          - homeassistant: "2026.7.4"
            phcc: "0.13.348"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest-homeassistant-custom-component==${{ matrix.phcc }}"
      - name: Verify the expected Home Assistant version
        run: |
          python -c "from homeassistant.const import __version__ as v; \
            assert v == '${{ matrix.homeassistant }}', v; print('HA', v)"
      - name: Run tests
        run: python -m pytest --cov-fail-under=85
